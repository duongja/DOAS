<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c09" />
    <title>Offline — Diaries of a Soldier</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a07;
        --panel: #11140f;
        --line: rgba(205, 222, 189, 0.16);
        --text: #e6ece0;
        --muted: #97a28e;
        --accent: #c7f36b;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(199, 243, 107, 0.08), transparent 42%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 30px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--accent);
        font-size: 26px;
      }
      .kicker {
        display: block;
        margin: 20px 0 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.025em; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      button {
        width: 100%;
        border: 1px solid #d5ff82;
        border-radius: 9px;
        background: var(--accent);
        color: #10140b;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 750;
        padding: 11px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <span class="kicker">Diaries of a Soldier</span>
      <h1>You’re offline.</h1>
      <p>
        The app shell is available, but the operator session and live data need a connection.
        Reconnect, then retry.
      </p>
      <button type="button" id="retry-button">Retry connection</button>
    </main>
    <script>
      document.getElementById('retry-button').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
